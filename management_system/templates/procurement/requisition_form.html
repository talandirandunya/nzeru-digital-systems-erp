{% extends 'base.html' %}{% block title %}Purchase requisition{% endblock %}{% block content %}<h2>Purchase requisition</h2><form method="post">{% csrf_token %}{{ form.as_p }}<table class="table"><tr><th>Stock</th><th>Quantity</th></tr>{% for stock in stocks %}<tr><td><input type="checkbox" name="stock_id" value="{{ stock.pk }}"> {{ stock.name }}</td><td><input type="number" name="quantity" min="0" value="0"></td></tr>{% endfor %}</table><button class="btn btn-primary">Create</button></form>{% endblock %}
